# ============================================================
# E-Cell Pitch Competition Registration Page — CI/CD Pipeline
# GitHub Actions Workflow (Phases 1-4 Automated Verification)
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Weekly dependency audit — every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

# Cancel any in-progress run for the same branch/PR to avoid queue pile-up
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. LINT & TYPE CHECK
  # ──────────────────────────────────────────────────────────
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies & native linux bindings
        run: |
          npm install
          npm --prefix client install @rolldown/binding-linux-x64-gnu@1.2.6

      - name: TypeScript & Build Check — Client
        run: npm --prefix client run build

      - name: TypeScript & Build Check — Server
        run: npm --prefix server run build

  # ──────────────────────────────────────────────────────────
  # 2. SECURITY & DEPENDENCY AUDIT (SCA)
  # ──────────────────────────────────────────────────────────
  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: npm audit
        run: npm audit --audit-level=high || true

  # ──────────────────────────────────────────────────────────
  # 3. AUTOMATED INTEGRATION TEST SUITES (Phases 2, 3 & 4)
  # ──────────────────────────────────────────────────────────
  test-suites:
    name: Integration Verification Suites
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build Server
        run: npm --prefix server run build

      - name: Run Phase 2 (10 Lifecycle Checkpoints)
        run: node server/test-10-checkpoints.js

      - name: Run Phase 3 (Firestore & Concurrency)
        run: node server/test-phase3-firestore.js

      - name: Run Phase 4 (AppSec & Magic-Byte Scanner)
        run: node server/test-phase4-security.js

  # ──────────────────────────────────────────────────────────
  # 4. PRODUCTION BUILD
  # ──────────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, security-audit, test-suites]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies & native linux bindings
        run: |
          npm install
          npm --prefix client install @rolldown/binding-linux-x64-gnu@1.2.6

      - name: Build Full Stack (Client & Server)
        run: npm run build

      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: ./client/dist/
          retention-days: 1
