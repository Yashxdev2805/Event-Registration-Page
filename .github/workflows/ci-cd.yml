# ============================================================
# E-Cell Pitch Competition Registration Page — CI/CD Pipeline
# GitHub Actions Workflow
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Weekly dependency audit — every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual trigger from the GitHub Actions UI

# Cancel any in-progress run for the same branch/PR to avoid queue pile-up
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# Environment-level defaults
# ============================================================
env:
  NODE_VERSION: '22'

# ============================================================
# JOBS
# ============================================================
jobs:

  # ──────────────────────────────────────────────────────────
  # 1. LINT & TYPE CHECK
  # ──────────────────────────────────────────────────────────
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      # Client
      - name: Install client dependencies
        run: npm ci
        working-directory: ./client

      - name: TypeScript & Build Check — client
        run: npm run build
        working-directory: ./client

      # Server (conditional on Phase 2 existing)
      - name: Install server dependencies
        if: hashFiles('server/package.json') != ''
        run: npm ci
        working-directory: ./server

      - name: TypeScript — server
        if: hashFiles('server/package.json') != ''
        run: npm run build
        working-directory: ./server

  # ──────────────────────────────────────────────────────────
  # 2. SECURITY AUDIT
  # ──────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      # npm audit — client
      - name: npm audit — client
        run: |
          npm ci
          npm audit --audit-level=high || true
        working-directory: ./client

      # npm audit — server
      - name: npm audit — server
        if: hashFiles('server/package.json') != ''
        run: |
          npm ci
          npm audit --audit-level=high || true
        working-directory: ./server

  # ──────────────────────────────────────────────────────────
  # 3. BUILD
  # ──────────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, security-audit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      # Build client (Vite)
      - name: Install client dependencies
        run: npm ci
        working-directory: ./client

      - name: Build client
        run: npm run build
        working-directory: ./client
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      # Build server (TypeScript compile if present)
      - name: Install server dependencies
        if: hashFiles('server/package.json') != ''
        run: npm ci
        working-directory: ./server

      - name: Compile server TypeScript
        if: hashFiles('server/package.json') != ''
        run: npm run build
        working-directory: ./server

      # Cache artifacts for deploy jobs
      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: ./client/dist/
          retention-days: 1
