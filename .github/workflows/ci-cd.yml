# ============================================================
# E-Cell Pitch Competition Registration Page — CI/CD Pipeline
# GitHub Actions Workflow (Phases 1-4 Automated Verification)
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Weekly dependency audit — every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

# Cancel any in-progress run for the same branch/PR to avoid queue pile-up
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. LINT & TYPE CHECK
  # ──────────────────────────────────────────────────────────
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      # Client
      - name: Install client dependencies
        run: npm ci
        working-directory: ./client

      - name: TypeScript & Build Check — client
        run: npm run build
        working-directory: ./client

      # Server
      - name: Install server dependencies
        if: hashFiles('server/package.json') != ''
        run: npm ci
        working-directory: ./server

      - name: TypeScript & Build Check — server
        if: hashFiles('server/package.json') != ''
        run: npm run build
        working-directory: ./server

  # ──────────────────────────────────────────────────────────
  # 2. SECURITY & DEPENDENCY AUDIT (SCA)
  # ──────────────────────────────────────────────────────────
  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: npm audit — client
        run: |
          npm ci
          npm audit --audit-level=high || true
        working-directory: ./client

      - name: npm audit — server
        if: hashFiles('server/package.json') != ''
        run: |
          npm ci
          npm audit --audit-level=high || true
        working-directory: ./server

  # ──────────────────────────────────────────────────────────
  # 3. AUTOMATED INTEGRATION TEST SUITES (Phases 2, 3 & 4)
  # ──────────────────────────────────────────────────────────
  test-suites:
    name: Integration Verification Suites
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install server dependencies
        run: npm ci
        working-directory: ./server

      - name: Build server
        run: npm run build
        working-directory: ./server

      - name: Run Phase 2 (10 Lifecycle Checkpoints)
        run: node test-10-checkpoints.js
        working-directory: ./server

      - name: Run Phase 3 (Firestore & Concurrency)
        run: node test-phase3-firestore.js
        working-directory: ./server

      - name: Run Phase 4 (AppSec & Magic-Byte Scanner)
        run: node test-phase4-security.js
        working-directory: ./server

  # ──────────────────────────────────────────────────────────
  # 4. PRODUCTION BUILD
  # ──────────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, security-audit, test-suites]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      # Build client (Vite)
      - name: Install client dependencies
        run: npm ci
        working-directory: ./client

      - name: Build client
        run: npm run build
        working-directory: ./client
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      # Build server
      - name: Install server dependencies
        if: hashFiles('server/package.json') != ''
        run: npm ci
        working-directory: ./server

      - name: Compile server TypeScript
        if: hashFiles('server/package.json') != ''
        run: npm run build
        working-directory: ./server

      # Cache artifacts
      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: ./client/dist/
          retention-days: 1
