# Railway Nixpacks Configuration for Monorepo Backend Deployment
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm install",
  "npm --prefix client install @rolldown/binding-linux-x64-gnu@1.2.6 lightningcss-linux-x64-gnu@1.32.0"
]

[phases.build]
cmds = [
  "npm --prefix server run build"
]

[start]
cmd = "npm --prefix server start"
